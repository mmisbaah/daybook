<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173a32">
  <title>Daybook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/"><span class="brand-icon">DB</span><span>Daybook</span></a>
      <nav aria-label="Main navigation" id="navigation">
        <button type="button" data-view="calendar"><span aria-hidden="true">▦</span> Calendar</button>
        <button type="button" data-view="clients"><span aria-hidden="true">♧</span> Clients</button>
        <button type="button" data-view="requests"><span aria-hidden="true">◇</span> Requests <span class="badge" id="requestCount" hidden></span></button>
        <button type="button" data-view="settings"><span aria-hidden="true">⚙</span> Practice settings</button>
        <button type="button" id="logoutButton"><span aria-hidden="true">↪</span> Sign out</button>
      </nav>
      <div class="sidebar-bottom">
        <p id="practiceName">Your practice</p>
        <a href="/book/" target="_blank" rel="noopener">Open booking page ↗</a>
      </div>
    </aside>
    <main id="main" tabindex="-1"><div id="view" class="main-inner"><div class="loading">Loading your workspace…</div></div></main>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="editor"><form method="dialog" id="editorForm"></form></dialog>
</body>
</html>
