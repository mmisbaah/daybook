<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daybook — Fairlight Counseling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="../css/workspace.css?v=1">
</head>
<body>

<div class="app">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">DB</div>
      <div class="sb-name">Daybook</div>
    </div>

    <nav class="sb-nav">
      <button class="sb-item" data-nav="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        <span>Daybook</span>
      </button>
      <button class="sb-item" data-nav="clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 15.2c2.6.3 4.7 1.9 5.5 4.8"/></svg>
        <span>Clients</span>
      </button>
      <button class="sb-item" data-nav="requests">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Requests</span>
        <em class="sb-badge">2</em>
      </button>
      <button class="sb-item" data-nav="booking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07L11.5 5.4"/><path d="M14 10a5 5 0 00-7.07 0L4.1 12.83a5 5 0 007.07 7.07l1.33-1.3"/></svg>
        <span>Booking page</span>
      </button>
    </nav>

    <div class="sb-foot">
      <div class="sb-practice">
        <div class="sb-ava">NO</div>
        <div>
          <div class="sb-pname">Naomi Okafor, LMFT</div>
          <div class="sb-ploc">Portland, OR</div>
        </div>
      </div>
      <a class="sb-link" href="../index.html" target="_blank">Phone prototype ↗</a>
    </div>
  </aside>

  <!-- ══════════ MAIN ══════════ -->
  <main class="main" id="main">
    <div class="view" id="view"></div>
  </main>

</div>

<!-- sheets -->
<div class="sheet-layer" id="sheetLayer" hidden>
  <div class="scrim" data-act="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<!-- toast -->
<div class="toast-layer" id="toastLayer"></div>

<script src="../js/ui.js"></script>
<script src="../js/data.js"></script>
<script src="js/screens.js"></script>
<script src="../js/workspace.js?v=1"></script>
<script src="js/app.js"></script>
</body>
</html>
